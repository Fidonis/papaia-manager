# Where `pybabel extract` finds the texts to translate. Run it from this directory with `app`
# as the input directory, so the patterns below are relative to `app/`:
#
#   uv run pybabel extract -F babel.cfg --no-location --no-wrap -o app/locale/messages.pot app
#
# `tests/test_i18n_catalog.py` extracts with the same file, so what the command finds is what the
# test demands a translation for.

[python: **.py]

[jinja2: templates/**.html]
extensions = jinja2.ext.i18n
# Collapse the whitespace of a {% trans %} block, as the application does when it renders.
trimmed = true
newstyle_gettext = true
# A template that does not parse is an error, not a file that silently yields nothing.
silent = false
