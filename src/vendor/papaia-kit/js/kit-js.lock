# The kit's browser tools (pk-conform) for the design check, scripts/design-tools.sh.
#
# The kit has no npm registry yet. The package is `npm pack` (npm 11.19.0) of the
# kit's js/ folder at the commit of kit.lock, with the kit's LICENSE copied into
# js/ first; it is not part of the server image (.dockerignore). Rebuild with:
#   git archive <commit> js LICENSE | tar -x -C <dir>
#   cp <dir>/LICENSE <dir>/js/ && (cd <dir>/js && npm pack)
#   shasum -a 256 vendor/papaia-kit/js/papaia-kit-0.2.2.tgz

