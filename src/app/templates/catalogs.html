{% extends "base.html" %}
{% block title %}Catalogs — papAIa manager{% endblock %}

{% block page_title %}Catalogs{% endblock %}
{% block page_subtitle %}<p class="mt-0.5 text-sm opacity-50">Verwalte deine Add-On-Quellen</p>{% endblock %}
{% block page_actions %}
<button
  class="btn btn-primary btn-sm"
  onclick="document.getElementById('add-catalog-modal').showModal()"
>
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
  </svg>
  Add catalog
</button>
{% endblock %}

{% block content %}
<div
  id="catalog-list"
  hx-get="/partials/catalogs"
  hx-trigger="load"
  hx-swap="innerHTML"
>
  <div class="flex justify-center py-20">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>
</div>

<!-- Add catalog modal -->
<dialog id="add-catalog-modal" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold mb-4">Add catalog</h3>
    <form
      hx-post="/api/v1/catalogs"
      hx-target="#catalog-list"
      hx-swap="innerHTML"
      hx-on::after-request="document.getElementById('add-catalog-modal').close()"
    >
      <div class="form-control mb-3">
        <label class="label"><span class="label-text">Name</span></label>
        <input name="name" type="text" class="input input-bordered" required
               placeholder="my-catalog" pattern="[a-z0-9][a-z0-9\-]{0,31}">
      </div>
      <div class="form-control mb-3">
        <label class="label"><span class="label-text">Type</span></label>
        <select id="catalog-type-select" name="type" class="select select-bordered"
                onchange="toggleCatalogFields(this.value)">
          <option value="git">Git</option>
          <option value="local">Local</option>
        </select>
      </div>
      <div id="field-url" class="form-control mb-3">
        <label class="label"><span class="label-text">URL</span></label>
        <input name="url" type="url" class="input input-bordered" required
               placeholder="https://github.com/example/addons.git">
      </div>
      <div id="field-path" class="form-control mb-3 hidden">
        <label class="label"><span class="label-text">Path</span></label>
        <input name="path" type="text" class="input input-bordered" disabled
               placeholder="/path/to/local/addons">
      </div>
      <div class="modal-action">
        <button type="button" class="btn btn-ghost"
                onclick="document.getElementById('add-catalog-modal').close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
<script>
function toggleCatalogFields(type) {
  var urlField = document.getElementById('field-url');
  var pathField = document.getElementById('field-path');
  var urlInput = urlField.querySelector('input');
  var pathInput = pathField.querySelector('input');
  if (type === 'local') {
    urlField.classList.add('hidden');
    urlInput.required = false;
    urlInput.disabled = true;
    pathField.classList.remove('hidden');
    pathInput.required = true;
    pathInput.disabled = false;
  } else {
    pathField.classList.add('hidden');
    pathInput.required = false;
    pathInput.disabled = true;
    urlField.classList.remove('hidden');
    urlInput.required = true;
    urlInput.disabled = false;
  }
}
document.getElementById('add-catalog-modal').addEventListener('close', function () {
  document.getElementById('catalog-type-select').value = 'git';
  toggleCatalogFields('git');
});
</script>
{% endblock %}
