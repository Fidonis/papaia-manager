{% extends "base.html" %}

{% block page_title %}{% trans %}Job Log{% endtrans %}{% endblock %}
{% set breadcrumb = [{"label": _("Jobs"), "href": "/jobs"}] %}

{% block content %}
<div class="card bg-base-100 border border-base-300">
  <div class="card-body">
    <div class="flex items-center gap-3 mb-2">
      <h2 class="card-title text-base font-semibold">{% trans %}Job{% endtrans %} <span class="font-mono text-sm opacity-60">{{ job_id }}</span></h2>
      <div
        id="job-status"
        hx-get="/partials/jobs/{{ job_id }}"
        hx-trigger="load, every 2s"
        hx-swap="outerHTML"
      >
        <span class="loading loading-dots loading-sm"></span>
      </div>
    </div>
    <div hx-get="/partials/jobs/{{ job_id }}/log" hx-trigger="load" hx-swap="outerHTML">
      <div class="flex justify-center py-10">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
