{% extends "base.html" %}
{% block title %}{{ addon_name }} — papAIa manager{% endblock %}

{% block page_title %}{{ addon_name }}{% endblock %}
{% block page_subtitle %}
<a href="/" class="mt-0.5 text-sm opacity-50 hover:opacity-80 transition-opacity flex items-center gap-1">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
  </svg>
  Dashboard
</a>
{% endblock %}

{% block content %}
<div
  id="addon-detail"
  hx-get="/partials/addons/{{ addon_name }}"
  hx-trigger="load"
  hx-swap="innerHTML"
>
  <div class="flex justify-center py-20">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>
</div>
{% endblock %}
