{% extends "base.html" %}

{% set breadcrumb = [{"label": _("Ingest Runs"), "href": "/ingest/runs"}] %}
{% block page_title %}{% trans %}Run{% endtrans %} <span class="font-mono">{{ (run_id | short_id) }}</span>{% endblock %}

{% block content %}
<div id="run-body"
     hx-get="/partials/ingest/runs/{{ run_id }}"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="flex justify-center py-20">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>
</div>

{% include "partials/_ingest_js.html" %}
<script>
function reloadRun() {
  htmx.ajax('GET', '/partials/ingest/runs/{{ run_id }}', { target: '#run-body', swap: 'innerHTML' });
}
document.body.addEventListener('htmx:responseError', function (event) {
  const detail = event.detail || {};
  if (!detail.target || detail.target.id !== 'run-body') return;
  if (detail.xhr && detail.xhr.status === 401) return;
  let reason = {{ _('The run could not be loaded.')|tojson }};
  try { reason = _ragDetail(JSON.parse(detail.xhr.responseText), detail.xhr.status); } catch (_) {}
  detail.target.innerHTML =
    '<div class="flex flex-col items-center py-24 gap-3 text-pk-text-muted text-center">' +
    '<p class="max-w-xl text-sm">' + _ragEscape(reason) + '</p></div>';
});
</script>
{% endblock %}
