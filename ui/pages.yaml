# Pages of the manager for the page list of the consistency audit
# (papaia.pages-part/1, contract/pages.md of papaia-kit).
#
# Every path is a full page of src/app/templates/ (partials and fragments loaded into a
# page are not listed); the kit's specimen page and the state page "Kein Zugang" are
# required in every part. The design check (scripts/design-check.sh) renders every row
# with a path, placeholders filled from tests/design_world.py. tests/test_kit_design.py
# checks the list against the kit's schema and the routes of the manager.
#
# signed_off_by: the product owner of the manager replaces this entry with name and date
# when signing the list off; until then it names the open sign-off instead of a person.
format: papaia.pages-part/1
module: manager
signed_off_by: {name: Sign-off by the product owner pending, date: "2026-11-23"}
pages:
