name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Run yamllint
        run: yamllint .

  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ruff
        run: pip install --user ruff
      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        run: pip install --user uv
      - name: Sync dependencies (incl. dev)
        working-directory: src
        run: uv sync --frozen
      - name: Run mypy
        working-directory: src
        run: uv run --frozen mypy .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        run: pip install --user uv
      - name: Sync dependencies
        working-directory: src
        run: uv sync --frozen
      - name: Run pytest
        working-directory: src
        run: uv run --frozen pytest -q

  design:
    # The kit's visual quality gate (pk-conform --design) over every page of ui/pages.yaml,
    # decided by scripts/check_design.py with ui/design-known.yaml. Everything it needs is
    # vendored or locked: no checkout of another repository and no secret.
    name: Design check (kit pk-conform --design)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install uv
        run: pip install --user uv==0.11.28
      - name: Sync dependencies
        working-directory: src
        run: uv sync --frozen
      - name: Install the design tools and build the page assets
        run: |
          scripts/design-tools.sh
          sudo node .pk/node_modules/playwright-core/cli.js install-deps chromium
      - name: pk-conform --design
        run: scripts/design-check.sh 57880 "${RUNNER_TEMP}/design-report.json"

  csp:
    # Browser check of the content security policy (T-UI-03): the check itself on seeded
    # pages, then every page of ui/pages.yaml with the report-only policy. A converted page
    # fails on any report, refused Alpine expression or script error; for the others the
    # counts, and what the shipped CSP build of Alpine still refuses, go to the job summary.
    name: Content security policy (browser check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install uv
        run: pip install --user uv==0.11.28
      - name: Sync dependencies
        working-directory: src
        run: uv sync --frozen
      - name: Install the browser tools and build the page assets
        run: |
          scripts/design-tools.sh
          sudo node .pk/node_modules/playwright-core/cli.js install-deps chromium
      - name: The check fails on seeded pages; toasts, the settings paths, overlay, mail and the dashboard editor in a browser
        working-directory: src
        run: >-
          uv run --frozen pytest -q -rs ../tests/test_csp_browser.py ../tests/test_toast_browser.py
          ../tests/test_settings_scripts.py ../tests/test_settings_mail_browser.py
          ../tests/test_dashboard_browser.py
      - name: Every page of the manager
        run: >-
          scripts/csp-check.sh 57882 "${RUNNER_TEMP}/csp-report.json" "${GITHUB_STEP_SUMMARY}"
          "csp-build=src/app/static/alpine-csp.min.js"

  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
